<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digitera Storefront</title>

  <!-- Firebase Compatibility SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <style>
    /* basic reset at styles para sa layout at modal */
    body { font-family: sans-serif; margin: 0; padding: 0; background: #f4f0f9; }
    footer { padding: 20px; text-align: center; background: #fff; margin-top: 40px; }
    .footer-links a { margin: 0 10px; cursor: pointer; color: #6b21a8; text-decoration: none; }
    
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: white; padding: 20px; border-radius: 12px; width: 90%; max-width: 800px; position: relative; max-height: 85vh; overflow-y: auto; }
    .close-btn { position: absolute; right: 15px; top: 15px; cursor: pointer; font-size: 20px; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }
    .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    .status-badge.completed { background: #dcfce7; color: #15803d; }
  </style>
</head>
<body>

  <main style="padding: 20px; text-align: center;">
    <h1>Welcome to Digitera Storefront</h1>
    <button id="secretAdminBtn" style="display:none; margin: 10px auto;" onclick="openModal('ordersModal')">View Orders Dashboard</button>
  </main>

  <!-- ORDERS DASHBOARD MODAL -->
  <div id="ordersModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal('ordersModal')">&times;</span>
      <h2>📊 Orders Dashboard</h2>
      
      <div style="display: flex; gap: 10px; justify-content: space-around; margin-bottom: 20px; background: #faf5ff; padding: 15px; border-radius: 8px;">
        <div>
          <small>Total Revenue</small>
          <h3 id="totalRevenue">₱0.00</h3>
        </div>
        <div>
          <small>Total Orders</small>
          <h3 id="totalOrders">0</h3>
        </div>
        <div>
          <small>Unique Customers</small>
          <h3 id="uniqueCustomers">0</h3>
        </div>
        <div>
          <small>Avg Order Value</small>
          <h3 id="avgOrderValue">₱0.00</h3>
        </div>
      </div>

      <h3>📋 Recent Orders</h3>
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Customer</th>
            <th>Items</th>
            <th>Total</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="ordersTableBody">
          <tr>
            <td colspan="5" style="text-align:center; padding:20px;">🔄 Loading latest orders...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <footer>
    <div class="footer-links">
      <a onclick="showPage('about',event)">About Us</a>
      <a onclick="showPage('faqs',event)">FAQs</a>
      <a onclick="showPage('contact',event)">Contact</a>
    </div>
    <p>© 2026 Digitera Levi Shop. All rights reserved.</p>
  </footer>

  <!-- 1. FIRST SCRIPT: PAGE & ROUTING CONTROLS -->
  <script>
    function dgtInit() {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('mode') === 'admin') {
        const adminBtn = document.getElementById('secretAdminBtn');
        if (adminBtn) adminBtn.style.display = 'block';
      }
    }

    if (document.readyState === "loading") {
      document.addEventListener('DOMContentLoaded', dgtInit);
    } else {
      dgtInit();
    }

    function openModal(id) {
      const modal = document.getElementById(id);
      if (modal) {
        modal.style.display = 'flex';
        if (id === 'ordersModal') {
          loadOrdersDashboard();
        }
      }
    }

    function closeModal(id) {
      const modal = document.getElementById(id);
      if (modal) modal.style.display = 'none';
    }

    function showPage(page, event) {
      if (event) event.preventDefault();
      if (page === 'home') return;
      openModal(page + 'Modal');
    }

    function closePageModal(id) {
      closeModal(id);
    }

    function toggleCart(e) {
      if (e) e.preventDefault();
      const cart = document.getElementById('cartModal');
      if (cart) cart.classList.toggle('open');
    }
  </script>

  <!-- 2. SECOND SCRIPT: FIREBASE CONFIG & DATA FETCHING -->
  <script>
    // CREDENTIALS DIRECT FROM YOUR FIREBASE CONSOLE
    const firebaseConfig = {
      apiKey: "AIzaSyDFQcwCJxIkTX0CCz8kaF7Sp2_hZNE1dIs",
      authDomain: "digitera-levi-shop.firebaseapp.com",
      projectId: "digitera-levi-shop",
      storageBucket: "digitera-levi-shop.appspot.com",
      messagingSenderId: "63166329156",
      appId: "1:63166329156:web:0b797f9438a98c84e46711"
    };

    // INITIALIZE FIREBASE & FIRESTORE
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    // LOAD ORDERS DASHBOARD DATA
    function loadOrdersDashboard() {
      const tableBody = document.getElementById('ordersTableBody');
      const totalRevenueEl = document.getElementById('totalRevenue');
      const totalOrdersEl = document.getElementById('totalOrders');
      const uniqueCustomersEl = document.getElementById('uniqueCustomers');
      const avgOrderValueEl = document.getElementById('avgOrderValue');

      if (!tableBody) return;

      tableBody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:20px;">🔄 Loading latest orders...</td></tr>';

      db.collection('orders')
        .orderBy('createdAt', 'desc')
        .get()
        .then((snapshot) => {
          if (snapshot.empty) {
            tableBody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:20px;">👎 No orders found.</td></tr>';
            if (totalRevenueEl) totalRevenueEl.innerText = '₱0.00';
            if (totalOrdersEl) totalOrdersEl.innerText = '0';
            if (uniqueCustomersEl) uniqueCustomersEl.innerText = '0';
            if (avgOrderValueEl) avgOrderValueEl.innerText = '₱0.00';
            return;
          }

          let html = '';
          let totalRevenue = 0;
          let totalOrders = 0;
          let customerEmails = new Set();

          snapshot.forEach((doc) => {
            const data = doc.data();
            const amount = Number(data.total || data.amount || 0);
            const customerName = data.customer || 'Customer';
            const email = data.email || 'N/A';
            const items = data.items || 'Digital Product';
            const status = data.status || 'Paid';
            
            let dateStr = 'Recent';
            if (data.createdAt && data.createdAt.toDate) {
              dateStr = data.createdAt.toDate().toLocaleDateString('en-PH', {
                month: 'short',
                day: 'numeric',
                year: 'numeric'
              });
            }

            totalRevenue += amount;
            totalOrders += 1;
            if (email !== 'N/A') customerEmails.add(email);

            html += `
              <tr>
                <td>${dateStr}</td>
                <td><strong>${customerName}</strong><br><small style="color:#888;">${email}</small></td>
                <td>${items}</td>
                <td><strong>₱${amount.toFixed(2)}</strong></td>
                <td><span class="status-badge completed">${status}</span></td>
              </tr>
            `;
          });

          tableBody.innerHTML = html;

          if (totalRevenueEl) totalRevenueEl.innerText = `₱${totalRevenue.toFixed(2)}`;
          if (totalOrdersEl) totalOrdersEl.innerText = totalOrders;
          if (uniqueCustomersEl) uniqueCustomersEl.innerText = customerEmails.size;
          if (avgOrderValueEl) {
            const avg = totalOrders > 0 ? (totalRevenue / totalOrders) : 0;
            avgOrderValueEl.innerText = `₱${avg.toFixed(2)}`;
          }
        })
        .catch((error) => {
          console.error("Error fetching orders:", error);
          tableBody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:red; padding:20px;">❌ Failed to load orders: ${error.message}</td></tr>`;
        });
    }
  </script>

</body>
</html>
